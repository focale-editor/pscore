name: pscore
description: Shared binary, descriptor, PackBits, and pattern codecs for Photoshop file formats.
version: 0.1.4
homepage: https://github.com/focale-editor/pscore
repository: https://github.com/focale-editor/pscore

topics:
  - photoshop
  - binary
  - codec
  - image-processing
  - file-format

screenshots:
  - description: 'A flat illustration of shared Photoshop binary and descriptor codecs.'
    path: screenshots/overview.png

environment:
  sdk: '>=3.13.0 <4.0.0'

dev_dependencies:
  checks: ^0.3.2
  lints: ^6.1.0
  release: ^0.1.11
  test: ^1.32.0

release:
  changelog:
    header: '# 📰 PsCore changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
