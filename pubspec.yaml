name: pscore
description: Shared binary, descriptor, PackBits, and pattern codecs for Photoshop file formats.
version: 0.1.1
homepage: https://github.com/focale-editor/pscore
repository: https://github.com/focale-editor/pscore

environment:
  sdk: '>=3.13.0 <4.0.0'

dev_dependencies:
  checks: ^0.3.1
  lints: ^6.1.0
  release: ^0.1.11
  test: ^1.31.2

release:
  changelog:
    header: '# 📰 PsCore changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
